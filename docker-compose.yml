name: ispm

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: web_docs
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./keycloak/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U admin -d web_docs',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:6.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secure_password
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: secure_password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: Admin123!
      KC_HOSTNAME: http://localhost:8090
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8090:8080'
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - '8000:8000'
    environment:
      - POSTGRES_DB=web_docs
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - MONGO_DB=web_docs
      - MONGO_USER=admin
      - MONGO_PASSWORD=secure_password
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - ALLOWED_HOSTS=localhost 127.0.0.1 backend
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_PUBLIC_URL=http://localhost:8090
      - KEYCLOAK_REALM=ispm
      - KEYCLOAK_CLIENT_ID=ispm-backend
      - KEYCLOAK_CLIENT_SECRET=your-client-secret
      - KEYCLOAK_AUDIENCE=account
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      keycloak:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - '3000:80'
    depends_on:
      - backend

volumes:
  postgres_data:
  mongo_data:
